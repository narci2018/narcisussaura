name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '构建范围(省 runner:只构建需要的平台)'
        type: choice
        options:
          - all
          - android
          - windows
          - macos
        default: all

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # psiphon-tunnel-core.exe, aether.exe and wintun.dll are Git LFS objects; with
          # smudge disabled the installer ships 133-byte pointer text in their place.
          lfs: true

      - name: Checkout LFS objects
        shell: pwsh
        run: git lfs checkout

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Download Windows Core Binaries
        shell: pwsh
        run: |
          function Download-WithRetry($url, $out) {
            for ($i = 1; $i -le 4; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 3
                if ((Get-Item $out).Length -gt 100000) { return }
                throw "downloaded file too small ($((Get-Item $out).Length) bytes)"
              } catch {
                Write-Host "Attempt $i failed: $_"
                if ($i -eq 4) { throw }
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/rules
          $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-windows-amd64.zip"
          Download-WithRetry $sbUrl "sing-box.zip"
          Expand-Archive sing-box.zip -DestinationPath sb_temp
          Get-ChildItem -Path sb_temp -Filter "sing-box.exe" -Recurse | Copy-Item -Destination src-tauri/binaries/sing-box.exe -Force
          $mhUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-windows-amd64-compatible-v1.19.31.zip"
          Download-WithRetry $mhUrl "mihomo.zip"
          Expand-Archive mihomo.zip -DestinationPath mh_temp
          Get-ChildItem -Path mh_temp -Filter "*.exe" -Recurse | Copy-Item -Destination src-tauri/binaries/mihomo.exe -Force

      - name: Verify Core Engine Architecture
        shell: pwsh
        run: |
          # psiphon-tunnel-core.exe and aether.exe come from the repo (Git LFS), not from a
          # download, so nothing else in this job would notice a 32-bit engine or an
          # un-pulled LFS pointer. Both happened: the bundled psiphon was i386 (os error 216
          # on the user's Win11 box) and this job used to check out with lfs disabled, which
          # shipped 133-byte pointer text as the engine.
          pwsh -NoProfile -File .github/verify-pe-arch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Windows Application
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: pnpm tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Download macOS Core Binaries
        run: |
          mkdir -p src-tauri/binaries/rules
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-darwin-arm64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          cp sing-box-*/sing-box src-tauri/binaries/sing-box
          chmod +x src-tauri/binaries/sing-box
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-darwin-arm64-v1.19.31.gz" -o mihomo.gz
          gzip -d mihomo.gz
          mv mihomo src-tauri/binaries/mihomo
          chmod +x src-tauri/binaries/mihomo

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build macOS Application
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrappers
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Download Android Core Binaries
        run: |
          mkdir -p src-tauri/binaries/rules
          curl -sL --retry 4 --retry-delay 5 --fail "https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-android-arm64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          cp sing-box-*/sing-box src-tauri/binaries/sing-box
          chmod +x src-tauri/binaries/sing-box
          # Residential/VPNGate nodes are OpenVPN and run on the mihomo core.
          # openvpn proxy type only exists from v1.19.x-with-stack (verified in
          # v1.19.31); android arm64 release builds carry the with_gvisor tag,
          # so the stack is userspace and needs no /dev/net/tun.
          curl -sL --retry 4 --retry-delay 5 --fail "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-android-arm64-v8-v1.19.31.gz" -o mihomo.gz
          gzip -d mihomo.gz
          mv mihomo src-tauri/binaries/mihomo
          chmod +x src-tauri/binaries/mihomo

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # psiphon-tunnel-core go.mod requires >= 1.26 (toolchain go1.26.5);
          # tunrelay (gvisor) builds fine on the newer Go too.
          go-version: '1.26'
          cache-dependency-path: tunrelay/go.sum

      - name: Build tunrelay (android/arm64)
        run: |
          cd tunrelay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../src-tauri/binaries/tunrelay .
          ls -la ../src-tauri/binaries/tunrelay

      - name: Build psiphon-tunnel-core (android/arm64)
        run: |
          # Pin the same revision the bundled Windows exe was built from
          # (buildinfo: Psiphon-Labs/psiphon-tunnel-core 96f782c6f6), so all
          # platforms speak the same protocol/server-entry format.
          #
          # The bundled src-tauri/binaries/psiphon-tunnel-core.exe comes from this same
          # revision, built with:
          #   GOTOOLCHAIN=go1.26.5 GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
          #     go build -trimpath -ldflags "-s -w" -o psiphon-tunnel-core.exe ./ConsoleClient
          # Keep it AMD64 (see .github/verify-pe-arch.ps1) and keep Go on the 1.26 line:
          # with go1.27 the binary panics before main, because psiphon-tls asserts that its
          # mirrored ConnectionState has the same field count as crypto/tls (18 vs 17).
          mkdir -p "$RUNNER_TEMP/ptc"
          cd "$RUNNER_TEMP/ptc"
          git init -q
          git remote add origin https://github.com/Psiphon-Labs/psiphon-tunnel-core.git
          git fetch -q --depth 1 origin 96f782c6f662cb0a884029d70e1375ab3c1dece2
          git checkout -q FETCH_HEAD
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/src-tauri/binaries/psiphon-tunnel-core" ./ConsoleClient
          ls -la "$GITHUB_WORKSPACE/src-tauri/binaries/psiphon-tunnel-core"

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Init Android Project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android init --ci

      - name: Inject VPN Components
        run: python3 src-tauri/mobile/android/inject_vpn.py

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"

          mkdir -p /tmp/ndk-bin
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang" /tmp/ndk-bin/aarch64-linux-android-clang
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang++" /tmp/ndk-bin/aarch64-linux-android-clang++
          ln -sf "$NDK_BIN/llvm-ar" /tmp/ndk-bin/aarch64-linux-android-ar
          export PATH="/tmp/ndk-bin:$PATH"

          mkdir -p src-tauri/.cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s"\n' "$NDK_BIN/aarch64-linux-android24-clang" > src-tauri/.cargo/config.toml

          pnpm tauri android build --apk --target aarch64

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/**/*.exe
            windows-installer/**/*.msi
            macos-arm64-dmg/*.dmg
            android-apk/**/*.apk
          generate_release_notes: true
