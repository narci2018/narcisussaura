name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download Windows Core Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/rules
          # Download sing-box for Windows
          $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip"
          Invoke-WebRequest -Uri $sbUrl -OutFile sing-box.zip
          Expand-Archive sing-box.zip -DestinationPath sb_temp
          Get-ChildItem -Path sb_temp -Filter "sing-box.exe" -Recurse | Copy-Item -Destination src-tauri/binaries/sing-box.exe -Force
          
          # Download mihomo for Windows
          $mhUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-windows-amd64-compatible-v1.19.2.zip"
          Invoke-WebRequest -Uri $mhUrl -OutFile mihomo.zip
          Expand-Archive mihomo.zip -DestinationPath mh_temp
          Get-ChildItem -Path mh_temp -Filter "*.exe" -Recurse | Copy-Item -Destination src-tauri/binaries/mihomo.exe -Force

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Windows Application
        run: pnpm tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Download macOS Core Binaries
        run: |
          mkdir -p src-tauri/binaries/rules
          # Download sing-box for macOS (arm64)
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-darwin-arm64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          cp sing-box-*/sing-box src-tauri/binaries/sing-box
          chmod +x src-tauri/binaries/sing-box
          
          # Download mihomo for macOS (arm64)
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-darwin-arm64-v1.19.2.gz" -o mihomo.gz
          gzip -d mihomo.gz
          mv mihomo src-tauri/binaries/mihomo
          chmod +x src-tauri/binaries/mihomo

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build macOS Application
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build sing-box for Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          git clone --depth 1 --branch v1.11.4 https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          cd /tmp/sing-box-src
          go build -tags "with_quic,with_utls,with_reality_server,with_acme,with_clash_api,with_wireguard,with_gvisor,with_lwip" -o sing-box ./cmd/sing-box
          mkdir -p $GITHUB_WORKSPACE/src-tauri/binaries/rules
          cp sing-box $GITHUB_WORKSPACE/src-tauri/binaries/sing-box
          chmod +x $GITHUB_WORKSPACE/src-tauri/binaries/sing-box

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Init Android Project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android init --ci

      - name: Inject VPN Components
        run: |
          python3 src-tauri/mobile/android/inject_vpn.py
          echo "--- Verifying injected files ---"
          ls -la src-tauri/gen/android/app/src/main/java/com/narcissus/aura/ || echo "Directory not found"
          ls -la src-tauri/gen/android/app/src/main/AndroidManifest.xml || echo "Manifest not found"

      - name: Rust cross-compile for Android (aarch64)
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"

          CLANG="$NDK_BIN/aarch64-linux-android24-clang"
          CLANGPP="$NDK_BIN/aarch64-linux-android24-clang++"
          AR="$NDK_BIN/llvm-ar"

          echo "=== DIAGNOSTICS ==="
          echo "NDK_HOME=$ANDROID_NDK_HOME"
          echo "CLANG=$CLANG"
          ls -la "$CLANG" || echo "CLANG NOT FOUND"
          rustup target list --installed
          echo "=== ENV VARS ==="

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          export CC_aarch64_linux_android="$CLANG"
          export CC_aarch64-linux-android="$CLANG"
          export CXX_aarch64_linux_android="$CLANGPP"
          export CXX_aarch64-linux-android="$CLANGPP"
          export AR_aarch64_linux_android="$AR"
          export AR_aarch64-linux-android="$AR"
          export CC="$CLANG"
          export CXX="$CLANGPP"
          export CFLAGS_aarch64_linux_android="--target=aarch64-linux-android24"
          export TARGET_CFLAGS="--target=aarch64-linux-android24"

          echo "CC_aarch64_linux_android=$CC_aarch64_linux_android"
          echo "CXX_aarch64_linux_android=$CXX_aarch64_linux_android"
          echo "AR_aarch64_linux_android=$AR_aarch64_linux_android"
          echo "CC=$CC"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          echo "=== BUILDING ==="

          mkdir -p src-tauri/.cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s"\n' "$CLANG" > src-tauri/.cargo/config.toml
          echo "Created .cargo/config.toml:"
          cat src-tauri/.cargo/config.toml

          cd src-tauri
          set +e
          cargo build --release --target aarch64-linux-android 2>&1 | tee /tmp/cross-compile.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "## Cross-compile FAILED (exit $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i "error" /tmp/cross-compile.log | tail -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
          echo "## Cross-compile succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Show cross-compile errors on failure
        if: failure()
        run: |
          echo "===== CROSS-COMPILE LAST 500 LINES ====="
          tail -500 /tmp/cross-compile.log 2>/dev/null || echo "NO LOG FILE"
          echo "===== ERROR LINES ====="
          grep -i "error" /tmp/cross-compile.log 2>/dev/null | tail -50 || true

      - name: Build Android APK (Gradle)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CC="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX="$NDK_BIN/aarch64-linux-android24-clang++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"

          pnpm tauri android build --apk --target aarch64 2>&1 | tee /tmp/android-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "## Gradle build FAILED (exit $BUILD_EXIT)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i "error" /tmp/android-build.log | tail -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "===== GRADLE BUILD FAILED - LAST 200 LINES ====="
            tail -200 /tmp/android-build.log
          fi
          exit $BUILD_EXIT

      - name: Show Gradle errors on failure
        if: failure()
        run: |
          echo "===== GRADLE LAST 300 LINES ====="
          tail -300 /tmp/android-build.log 2>/dev/null || true

      - name: Upload Android build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            /tmp/cross-compile.log
            /tmp/android-build.log

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/*.exe
            windows-installer/*.msi
            macos-arm64-dmg/*.dmg
            android-apk/**/*.apk
          generate_release_notes: true

