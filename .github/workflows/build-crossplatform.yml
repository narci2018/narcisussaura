name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Download Windows Core Binaries
        shell: pwsh
        run: |
          function Download-WithRetry($url, $out) {
            for ($i = 1; $i -le 4; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 3
                if ((Get-Item $out).Length -gt 100000) { return }
                throw "downloaded file too small ($((Get-Item $out).Length) bytes)"
              } catch {
                Write-Host "Attempt $i failed: $_"
                if ($i -eq 4) { throw }
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/rules
          $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-windows-amd64.zip"
          Download-WithRetry $sbUrl "sing-box.zip"
          Expand-Archive sing-box.zip -DestinationPath sb_temp
          Get-ChildItem -Path sb_temp -Filter "sing-box.exe" -Recurse | Copy-Item -Destination src-tauri/binaries/sing-box.exe -Force
          $mhUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-windows-amd64-compatible-v1.19.2.zip"
          Download-WithRetry $mhUrl "mihomo.zip"
          Expand-Archive mihomo.zip -DestinationPath mh_temp
          Get-ChildItem -Path mh_temp -Filter "*.exe" -Recurse | Copy-Item -Destination src-tauri/binaries/mihomo.exe -Force

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Windows Application
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: pnpm tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Download macOS Core Binaries
        run: |
          mkdir -p src-tauri/binaries/rules
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-darwin-arm64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          cp sing-box-*/sing-box src-tauri/binaries/sing-box
          chmod +x src-tauri/binaries/sing-box
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-darwin-arm64-v1.19.2.gz" -o mihomo.gz
          gzip -d mihomo.gz
          mv mihomo src-tauri/binaries/mihomo
          chmod +x src-tauri/binaries/mihomo

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build macOS Application
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrappers
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Download Android Core Binaries
        run: |
          mkdir -p src-tauri/binaries/rules
          curl -sL --retry 4 --retry-delay 5 --fail "https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-android-arm64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          cp sing-box-*/sing-box src-tauri/binaries/sing-box
          chmod +x src-tauri/binaries/sing-box

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tunrelay/go.sum

      - name: Build tunrelay (android/arm64)
        run: |
          cd tunrelay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../src-tauri/binaries/tunrelay .
          ls -la ../src-tauri/binaries/tunrelay

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Init Android Project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android init --ci

      - name: Inject VPN Components
        run: python3 src-tauri/mobile/android/inject_vpn.py

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"

          mkdir -p /tmp/ndk-bin
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang" /tmp/ndk-bin/aarch64-linux-android-clang
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang++" /tmp/ndk-bin/aarch64-linux-android-clang++
          ln -sf "$NDK_BIN/llvm-ar" /tmp/ndk-bin/aarch64-linux-android-ar
          export PATH="/tmp/ndk-bin:$PATH"

          mkdir -p src-tauri/.cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s"\n' "$NDK_BIN/aarch64-linux-android24-clang" > src-tauri/.cargo/config.toml

          pnpm tauri android build --apk --target aarch64

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/**/*.exe
            windows-installer/**/*.msi
            macos-arm64-dmg/*.dmg
            android-apk/**/*.apk
          generate_release_notes: true
