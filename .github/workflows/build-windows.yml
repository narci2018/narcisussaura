name: Build and Release Windows App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm Store Path
        shell: pwsh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $env:GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare Core Binaries & Resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries/rules"

          # 1. sing-box core
          if (-not (Test-Path "src-tauri/binaries/sing-box.exe")) {
            Write-Host "Downloading sing-box.exe..."
            try {
              $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip"
              Invoke-WebRequest -Uri $sbUrl -OutFile "sing-box.zip" -UseBasicParsing
              Expand-Archive -Path "sing-box.zip" -DestinationPath "sb_temp" -Force
              Copy-Item -Path "sb_temp/sing-box-*/sing-box.exe" -Destination "src-tauri/binaries/sing-box.exe" -Force
              Remove-Item -Recurse -Force "sing-box.zip", "sb_temp"
            } catch {
              Write-Warning "Failed to download sing-box: $_"
            }
          }

          # 2. mihomo core
          if (-not (Test-Path "src-tauri/binaries/mihomo.exe")) {
            Write-Host "Downloading mihomo.exe..."
            try {
              $mhUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-windows-amd64-v1.19.2.zip"
              Invoke-WebRequest -Uri $mhUrl -OutFile "mihomo.zip" -UseBasicParsing
              Expand-Archive -Path "mihomo.zip" -DestinationPath "mh_temp" -Force
              Copy-Item -Path "mh_temp/mihomo*.exe" -Destination "src-tauri/binaries/mihomo.exe" -Force
              Remove-Item -Recurse -Force "mihomo.zip", "mh_temp"
            } catch {
              Write-Warning "Failed to download mihomo: $_"
            }
          }

          # 3. wintun driver
          if (-not (Test-Path "src-tauri/binaries/wintun.dll")) {
            Write-Host "Downloading wintun.dll..."
            try {
              $wtUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
              Invoke-WebRequest -Uri $wtUrl -OutFile "wintun.zip" -UseBasicParsing
              Expand-Archive -Path "wintun.zip" -DestinationPath "wt_temp" -Force
              Copy-Item -Path "wt_temp/wintun/bin/amd64/wintun.dll" -Destination "src-tauri/binaries/wintun.dll" -Force
              Remove-Item -Recurse -Force "wintun.zip", "wt_temp"
            } catch {
              Write-Warning "Failed to download wintun: $_"
            }
          }

          Write-Host "--- Content of src-tauri/binaries ---"
          Get-ChildItem -Path "src-tauri/binaries"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Windows Installer
        shell: pwsh
        run: |
          pnpm tauri build

      - name: Upload Build Artifacts (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: NarcissusAura-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
