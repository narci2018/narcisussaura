name: Build and Release Windows App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS Objects
        shell: pwsh
        run: |
          git lfs checkout

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm Store Path
        shell: pwsh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $env:GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Verify Core Binaries and Rules Integrity
        shell: pwsh
        run: |
          $requiredFiles = @(
            "src-tauri/binaries/sing-box.exe",
            "src-tauri/binaries/mihomo.exe",
            "src-tauri/binaries/psiphon-tunnel-core.exe",
            "src-tauri/binaries/aether.exe",
            "src-tauri/binaries/wintun.dll",
            "src-tauri/binaries/server_entries.txt",
            "src-tauri/binaries/rules/geoip-cn.srs",
            "src-tauri/binaries/rules/geosite-cn.srs",
            "src-tauri/binaries/rules/geosite-category-ads-all.srs",
            "src-tauri/binaries/rules/geosite-private.srs"
          )

          Write-Host "=== Verifying Required Core Binaries and Rule Assets ==="
          $hasError = $false

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "MISSING FILE: $file does not exist!"
              $hasError = $true
            } else {
              $item = Get-Item $file
              $sizeMB = [math]::Round($item.Length / 1MB, 2)
              Write-Host "OK: $file ($sizeMB MB / $($item.Length) bytes)"
              
              # If file is a raw Git LFS pointer text (usually < 200 bytes), throw error
              if ($item.Length -lt 20000 -and $file.EndsWith(".exe")) {
                Write-Error "INVALID LFS POINTER: $file is only $($item.Length) bytes, not a real executable!"
                $hasError = $true
              }
            }
          }

          if ($hasError) {
            Write-Error "FATAL: One or more critical core engine binaries are missing or invalid LFS pointers. Aborting build."
            exit 1
          }

          Write-Host "SUCCESS: All 10 core engines, drivers and routing rules verified for packaging."

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Windows EXE Installer
        shell: pwsh
        run: |
          pnpm tauri build --bundles nsis

      - name: Verify Generated EXE Installer Size
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe"
          if ($installers.Count -eq 0) {
            Write-Error "FATAL: No NSIS exe installer found in src-tauri/target/release/bundle/nsis"
            exit 1
          }
          foreach ($inst in $installers) {
            $mb = [math]::Round($inst.Length / 1MB, 2)
            Write-Host "Generated installer: $($inst.FullName) - $mb MB"
            if ($mb -lt 30) {
              Write-Error "ERROR: Installer size ($mb MB) is suspiciously under 30MB! Core binaries may be missing."
              exit 1
            }
          }

      - name: Upload Build Artifacts (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: NarcissusAura-Windows-Setup-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
